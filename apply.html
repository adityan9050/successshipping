<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Apply for Role | Success Shipping Services</title>
  <link rel="icon" type="image/png" href="icon.png">
  <link rel="stylesheet" href="styles.css">
  
  <!-- Font Awesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <style>
    :root {
      --brand-orange: #EE5D2B;
      --brand-orange-hover: #D84C1C;
      --brand-dark: #0A0C0E;
      --text-dark: #111827;
      --text-muted: #6B7280;
      --border-light: #E5E7EB;
      --bg-light: #F9FAFB;
      --font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: var(--font-family); color: var(--text-dark); background-color: #FFFFFF; line-height: 1.5; }

    .container { width: 90%; max-width: 700px; margin: 0 auto; }

    .site-logo {
      height: 55px !important;
      max-height: 55px !important;
      width: auto !important;
      display: block;
      object-fit: contain;
    }

    /* STICKY HEADER */
    header.nav-header {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      z-index: 1000;
      background-color: var(--brand-dark);
      padding: 1rem 0;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
    }

    .nav-wrapper {
      display: flex;
      justify-content: space-between;
      align-items: center;
      width: 100%;
      max-width: 1200px;
      margin: 0 auto;
      padding: 0 5%;
    }

    .nav-menu {
      display: flex;
      gap: 2rem;
      list-style: none;
    }

    .nav-menu a {
      color: #FFFFFF;
      text-decoration: none;
      font-size: 0.88rem;
      opacity: 0.85;
      transition: 0.2s;
    }

    .nav-menu a:hover,
    .nav-menu a.active {
      opacity: 1;
      color: var(--brand-orange);
      font-weight: 700;
    }

    /* FORM SECTION */
    .apply-section { padding: 9rem 0 5rem; }
    
    .back-link {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      color: var(--text-muted);
      text-decoration: none;
      font-size: 0.9rem;
      font-weight: 600;
      margin-bottom: 2rem;
      transition: color 0.2s;
    }
    .back-link:hover { color: var(--brand-orange); }

    .form-card {
      background: #FFFFFF;
      border: 1px solid var(--border-light);
      border-radius: 12px;
      padding: 3rem 2.5rem;
      box-shadow: 0 4px 20px rgba(0,0,0,0.03);
    }

    .form-header {
      margin-bottom: 2rem;
      text-align: center;
    }

    .form-header h1 {
      font-size: 1.8rem;
      font-weight: 800;
      color: var(--text-dark);
      margin-bottom: 0.5rem;
    }

    .form-header p {
      color: var(--text-muted);
      font-size: 0.95rem;
    }

    .form-group {
      margin-bottom: 1.5rem;
    }

    .form-group label {
      display: block;
      font-weight: 600;
      font-size: 0.9rem;
      margin-bottom: 0.5rem;
      color: var(--text-dark);
    }

    .form-control {
      width: 100%;
      padding: 0.8rem 1rem;
      border: 1px solid var(--border-light);
      border-radius: 8px;
      font-family: inherit;
      font-size: 0.95rem;
      background: var(--bg-light);
      color: var(--text-dark);
      transition: border-color 0.2s;
    }

    .form-control:focus {
      outline: none;
      border-color: var(--brand-orange);
      background: #FFFFFF;
    }

    textarea.form-control {
      resize: vertical;
      min-height: 120px;
    }

    .btn-orange-pill {
      background-color: var(--brand-orange);
      color: #FFFFFF;
      width: 100%;
      padding: 0.9rem;
      border: none;
      border-radius: 50px;
      font-size: 0.95rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      cursor: pointer;
      transition: background-color 0.2s;
      margin-top: 1rem;
    }

    .btn-orange-pill:hover { background-color: var(--brand-orange-hover); }

    /* FOOTER */
    footer { background-color: var(--brand-dark); color: #FFFFFF; padding: 3rem 0 1.5rem; border-top: 1px solid rgba(255,255,255,0.1); }
    .footer-bottom { border-top: 1px solid rgba(255,255,255,0.1); padding-top: 1.5rem; text-align: center; color: rgba(255,255,255,0.5); font-size: 0.8rem; }
  </style>
</head>
<body>

  <!-- HEADER -->
  <header class="nav-header">
    <div class="nav-wrapper">
      <a href="index.html">
        <img src="logo-white.png" alt="Success Shipping Services" class="site-logo">
      </a>
      <nav>
        <ul class="nav-menu">
          <li><a href="index.html">Home</a></li>
          <li><a href="about.html">About Us</a></li>
          <li><a href="services.html">Services</a></li>
          <li><a href="careers.html" class="active">Careers</a></li>
          <li><a href="contact.html">Contact</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <!-- FORM SECTION -->
  <main class="apply-section">
    <div class="container">
      <a href="careers.html" class="back-link"><i class="fa-solid fa-arrow-left"></i> Back to Openings</a>
      
      <div class="form-card">
        <div class="form-header">
          <h1 id="job-title-heading">Job Application</h1>
          <p>Fill out the details below and attach your resume to apply.</p>
        </div>

        <form action="https://api.web3forms.com/submit" method="POST" enctype="multipart/form-data">
          <!-- Web3Forms Access Key (Use your same key here) -->
          <input type="hidden" name="access_key" value="YOUR_WEB3FORMS_ACCESS_KEY">
          
          <!-- Dynamic Subject Field updated via JS -->
          <input type="hidden" name="subject" id="form-subject-input" value="Career Application">
          
          <!-- Redirect to Thank You page after submission -->
          <input type="hidden" name="redirect" value="https://successshippingind.netlify.app/thank-you.html">

          <div class="form-group">
            <label for="name">Full Name <span style="color: var(--brand-orange);">*</span></label>
            <input type="text" id="name" name="name" class="form-control" placeholder="Enter your full name" required>
          </div>

          <div class="form-group">
            <label for="email">Email Address <span style="color: var(--brand-orange);">*</span></label>
            <input type="email" id="email" name="email" class="form-control" placeholder="name@example.com" required>
          </div>

          <div class="form-group">
            <label for="phone">Phone Number <span style="color: var(--brand-orange);">*</span></label>
            <input type="tel" id="phone" name="phone" class="form-control" placeholder="+91 XXXXX XXXXX" required>
          </div>

          <div class="form-group">
            <label for="message">Cover Note / Experience Summary</label>
            <textarea id="message" name="message" class="form-control" placeholder="Briefly describe your relevant experience..."></textarea>
          </div>

          <div class="form-group">
            <label for="resume">Upload Resume / CV (PDF, DOCX) <span style="color: var(--brand-orange);">*</span></label>
            <input type="file" id="resume" name="resume" accept=".pdf,.doc,.docx" class="form-control" required style="padding: 0.6rem;">
            <small style="color: var(--text-muted); display: block; margin-top: 0.4rem;">Max file size: 5MB</small>
          </div>

          <button type="submit" class="btn-orange-pill">Submit Application</button>
        </form>
      </div>
    </div>
  </main>

  <!-- FOOTER -->
  <footer>
    <div class="container" style="max-width: 1200px;">
      <div class="footer-bottom">
        &copy; 2026 Success Shipping Services (Chennai) Pvt Ltd. All rights reserved.
      </div>
    </div>
  </footer>

  <script>
    document.addEventListener('DOMContentLoaded', function () {
      const urlParams = new URLSearchParams(window.location.search);
      const subjectParam = urlParams.get('subject');

      if (subjectParam) {
        const decodedSubject = decodeURIComponent(subjectParam);

        // Update hidden subject field for Web3Forms email
        const subjectInput = document.getElementById('form-subject-input');
        if (subjectInput) {
          subjectInput.value = decodedSubject;
        }

        // Update the form title heading with the specific role name
        const heading = document.getElementById('job-title-heading');
        if (heading) {
          heading.textContent = decodedSubject.replace('Career Application - ', 'Applying for: ');
        }
      }
    });
  </script>
</body>
</html>
